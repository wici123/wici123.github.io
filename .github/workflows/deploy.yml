name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AE6C3A: ${{ secrets.AE6C3A }}
          BDDD8D: ${{ secrets.BDDD8D }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AE6C3A', ''), os.environ.get('BDDD8D', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 31df6b5c2fb2abca3ccbe4 -->', a)
          if b:
              patched = patched.replace('<!-- 0dd30bf6fc9f8aa58f8dc3da2502159a75510de4321373dc -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
